
<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://generativelanguage.googleapis.com https://cdn.tailwindcss.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://generativelanguage.googleapis.com https://esm.sh; img-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self';">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="thari_icon.jpg">
    
    <title>Thari - ثري</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --sat: env(safe-area-inset-top, 0px); 
            --sab: env(safe-area-inset-bottom, 0px); 
            --sal: env(safe-area-inset-left, 0px); 
            --sar: env(safe-area-inset-right, 0px); 
            --app-height: 100vh;
        }
        @supports (height: 100dvh) {
            :root {
                --app-height: 100dvh;
            }
        }
        
        html, body {
            width: 100%;
            height: var(--vh, var(--app-height));
            min-height: -webkit-fill-available;
            margin: 0;
            padding: 0;
            background-color: #020617;
            overflow: hidden;
        }

        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            /* Disable selection and tap highlights for app-like feel */
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            overscroll-behavior-y: none;
        }
        
        #root { 
            width: 100%; 
            height: var(--vh, var(--app-height));
            min-height: -webkit-fill-available;
            display: flex; 
            flex-direction: column;
            justify-content: flex-start; 
            align-items: stretch;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }
        @media (min-width: 768px) {
            #root {
                align-items: center;
                background: radial-gradient(circle at center, rgba(15, 23, 42, 0.4) 0%, rgba(2, 6, 23, 0.9) 100%);
            }
        }

        /* Luxury Aurora Background - Subtle */
        .aurora-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: #0f172a;
        }
        .aurora-blob {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.1;
            animation: move 25s infinite alternate;
        }
        .blob-1 { background: #d97706; top: -300px; right: -200px; }
        .blob-2 { background: #3b82f6; bottom: -300px; left: -200px; animation-delay: -5s; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(50px, 50px) scale(1.1); }
        }
        
        .glass-effect { 
            backdrop-filter: blur(40px); 
            background-color: rgba(15, 23, 42, 0.7); 
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        
        .bottom-nav-safe {
            padding-bottom: calc(var(--sab) + 1.5rem) !important;
        }

        ::-webkit-scrollbar { display: none; }
        
        /* Hide scrollbars for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            background-size: 200% 100%;
            animation: shimmer 4s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-luxury-pop {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* Marquee Animation for RTL */
        @keyframes scroll-rtl {
            0% { transform: translateX(0); }
            100% { transform: translateX(50%); }
        }
        .animate-marquee-rtl {
            animation: scroll-rtl 30s linear infinite;
        }
        .pause:hover {
            animation-play-state: paused;
        }
        .mask-gradient-x {
            mask-image: linear-gradient(to left, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to left, transparent, black 15%, black 85%, transparent);
        }
        
        /* Improved Print Styles */
        @media print {
            body {
                background: white !important;
                color: black !important;
                height: auto !important;
                overflow: visible !important;
                overscroll-behavior-y: auto; /* Allow scroll on print */
            }
            .aurora-bg, header, nav, .glass-effect, .no-print, button, select, input, .fixed { 
                display: none !important; 
            }
            #root {
                display: block !important;
                height: auto !important;
                position: static !important;
                overflow: visible !important;
            }
            /* Ensure the report container and all its parents are visible */
            .print\:block {
                display: block !important;
            }
            #printable-report { 
                display: block !important; 
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                background: white !important;
                color: black !important;
                z-index: 9999 !important;
            }
            @page {
                margin: 1.5cm;
                size: A4;
            }
        }

        /* High-PPI Mobile Screen Font Size Adjustments / Compensations */
        @media (max-width: 767px) {
            .text-\[9px\], .text-\[8px\], .text-\[10px\], .text-\[11px\] {
                font-size: 10px !important;
                letter-spacing: 0.01em !important;
                line-height: 1.35 !important;
            }
        }

        /* Chrome, Safari, Edge, Opera: Hide number field spinners */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Firefox: Hide number field spinners */
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Tajawal secondary headings font-weight optimization to reduce visual crowding */
        h2, h3, h4, h5, h6, 
        .secondary-heading, 
        [class*="text-lg"].font-black, 
        [class*="text-md"].font-black, 
        [class*="text-base"].font-black,
        [class*="text-sm"].font-black {
            font-weight: 700 !important; /* Elegant bold (700) instead of heavy black (900) to keep Arabic letters clear and distinct */
        }
        
        h3.font-extrabold, h4.font-extrabold, h5.font-extrabold,
        [class*="text-lg"].font-extrabold, [class*="text-md"].font-extrabold, [class*="text-base"].font-extrabold {
            font-weight: 500 !important; /* Slightly lighter weight for subtitles to reduce visual crowding */
        }
    </style>
    <script>
        function updateViewportHeight() {
            var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            document.documentElement.style.setProperty('--vh', vh + 'px');
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', updateViewportHeight);
            window.visualViewport.addEventListener('scroll', updateViewportHeight);
        } else {
            window.addEventListener('resize', updateViewportHeight);
        }
        window.addEventListener('DOMContentLoaded', updateViewportHeight);
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "recharts": "https://esm.sh/recharts@^3.7.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div class="aurora-bg">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
