
<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5CB96" />
      <stop offset="50%" stop-color="#D9B978" />
      <stop offset="100%" stop-color="#B38E46" />
    </linearGradient>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182028" />
      <stop offset="100%" stop-color="#0A0D10" />
    </linearGradient>
  </defs>

  <!-- الخلفية الداكنة الفاخرة (Carbon/Graphite) -->
  <rect width="100" height="100" rx="28" fill="url(#bg-gradient)" />
  
  <!-- إطار ذهبي شمبانيا نحيف -->
  <rect x="2" y="2" width="96" height="96" rx="26" stroke="url(#gold-gradient)" stroke-width="1.2" stroke-opacity="0.45" />

  <!-- الرمز: أعمدة النمو (تمثل نقاط الثاء وتراكم الثروة) -->
  <rect x="24" y="45" width="12" height="20" rx="6" fill="url(#gold-gradient)" />
  <rect x="44" y="25" width="12" height="40" rx="6" fill="url(#gold-gradient)" />
  <rect x="64" y="35" width="12" height="30" rx="6" fill="url(#gold-gradient)" />

  <!-- المنحنى السفلي الحافظ للثروة -->
  <path d="M 24 78 Q 50 92 76 78" stroke="url(#gold-gradient)" stroke-width="5" stroke-linecap="round" />
</svg>
