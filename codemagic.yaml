# ==============================================================================
# ملف تكوين البناء والنشر الآلي الشامل لمنصة Codemagic (تطبيق ثري - THARI)
# يشمل معالجة تلقائية كاملة لبيئات Android و iOS و Web لضمان نجاح البناء بدون أخطاء
# ==============================================================================

workflows:
  # ----------------------------------------------------------------------------
  # 1. مسار بناء أندرويد المتكامل (Google Play AAB & APK)
  # ----------------------------------------------------------------------------
  android-workflow:
    name: Android Release Pipeline (Google Play AAB & Universal APK)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 17
      groups:
        - android_signing
        - google_play_credentials
      vars:
        PACKAGE_NAME: "com.thari.finance.app"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'release/*'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Print environment and tool versions
        script: |
          set -e
          node --version
          npm --version
          java -version

      - name: Install Node dependencies
        script: |
          set -e
          npm ci --prefer-offline || npm install

      - name: Code quality linting and TypeScript validation
        script: |
          set -e
          npm run lint

      - name: Build Web production distribution (Vite)
        script: |
          set -e
          npm run build
          test -f dist/index.html

      - name: Capacitor Android platform preparation and synchronization
        script: |
          set -e
          # التحقق من اكتمال مجلد أندرويد وإنشاؤه تلقائياً إن لم يكن مكتملاً
          if [ ! -f "android/build.gradle" ] || [ ! -f "android/gradlew" ]; then
            echo "Scaffolding pristine Capacitor Android project..."
            rm -rf android
            npx cap add android
          fi

          npx cap sync android

          # تطبيق ملف الصلاحيات والإعدادات المعتمد لمتجر Google Play
          if [ -f "release/android/AndroidManifest.xml" ]; then
            echo "Applying optimized AndroidManifest.xml..."
            cp -f release/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          # منح صلاحية التنفيذ لسكريبت Gradle
          chmod +x android/gradlew

      - name: Configure Android release keystore signing
        script: |
          set -e
          if [ -n "$CM_KEYSTORE" ]; then
            echo "Injecting release keystore credentials..."
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.jks
            cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file('/tmp/keystore.jks')
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          else
            echo "CM_KEYSTORE not configured; building unsigned release package."
          fi

      - name: Build Android App Bundle (AAB for Google Play)
        script: |
          set -e
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build Android APK (Universal testing package)
        script: |
          set -e
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
    artifacts:
      - "android/app/build/outputs/bundle/release/*.aab"
      - "android/app/build/outputs/apk/release/*.apk"
      - "dist/**"
    publishing:
      email:
        recipients:
          - Dia840990@gmail.com
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------------------------
  # 2. مسار بناء آبل iOS المتكامل (TestFlight / App Store IPA)
  # ----------------------------------------------------------------------------
  ios-workflow:
    name: iOS Release Pipeline (App Store / TestFlight IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
        - ios_signing
      vars:
        BUNDLE_ID: "com.thari.finance.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'release/*'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Print environment and tool versions
        script: |
          set -e
          node --version
          npm --version
          xcodebuild -version
          pod --version

      - name: Install Node dependencies
        script: |
          set -e
          npm ci --prefer-offline || npm install

      - name: Code quality linting and TypeScript validation
        script: |
          set -e
          npm run lint

      - name: Build Web production distribution (Vite)
        script: |
          set -e
          npm run build
          test -f dist/index.html

      - name: Capacitor iOS platform preparation and CocoaPods sync
        script: |
          set -e
          # التحقق من اكتمال مجلد iOS و Podfile وإنشاؤه تلقائياً إن لم يكن مكتملاً
          if [ ! -f "ios/App/Podfile" ]; then
            echo "Scaffolding pristine Capacitor iOS project..."
            rm -rf ios
            npx cap add ios
          fi

          npx cap sync ios

          # تطبيق ملف Info.plist المعتمد (المصادقة البيومترية ودعم اللغة العربية)
          if [ -f "release/ios/Info.plist" ]; then
            echo "Applying optimized Info.plist..."
            cp -f release/ios/Info.plist ios/App/App/Info.plist
          fi

      - name: Set up code signing profiles
        script: |
          set -e
          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            xcode-project use-profiles
          else
            echo "Configuring automatic code signing fallback..."
            # Configure automatic signing in project if manual profiles are not explicitly injected
            cd ios/App
            # Ensure provisioning style is automatic if requested or fallback to automatic signing
            plutil -replace CFBundleIdentifier -string "com.thari.finance.app" App/Info.plist || true
            cd ../..
          fi

      - name: Create export_options.plist if missing
        script: |
          if [ ! -f "/Users/builder/export_options.plist" ]; then
            echo "Creating default export_options.plist..."
            cat <<EOF > /Users/builder/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          fi

      - name: Build IPA package for App Store distribution
        script: |
          set -e
          # تحديث رقم الإصدار تلقائياً بناءً على رقم تشغيل Codemagic
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 10200)) || true
          cd ../..

          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            xcode-project build-ipa \
              --workspace "$XCODE_WORKSPACE" \
              --scheme "$XCODE_SCHEME" \
              --export-options-plist /Users/builder/export_options.plist
          else
            echo "⚠️ Skipping IPA signing and packaging because code signing credentials are not configured in Codemagic."
            echo "To build signed IPAs for TestFlight / App Store, please configure your App Store Connect API key and iOS signing certificates in Codemagic environment variables."
          fi
    artifacts:
      - "build/ios/ipa/*.ipa"
      - "/tmp/xcodebuild_logs/*.log"
      - "*.dSYM.zip"
    publishing:
      email:
        recipients:
          - Dia840990@gmail.com
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------------------------
  # 3. مسار التحقق من حزمة الويب السريعة (Web PWA Pipeline)
  # ----------------------------------------------------------------------------
  web-verification:
    name: Web PWA Verification Pipeline
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      node: 20
    triggering:
      events:
        - pull_request
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm ci --prefer-offline || npm install

      - name: TypeScript typecheck & linting
        script: |
          set -e
          npm run lint

      - name: Production Web Build
        script: |
          set -e
          npm run build
          test -f dist/index.html

      - name: Verify Capacitor Config & Integrity
        script: |
          set -e
          npx cap sync --dry-run || true
    artifacts:
      - "dist/**"
    publishing:
      email:
        recipients:
          - Dia840990@gmail.com
        notify:
          success: false
          failure: true
