# ==============================================================================
# ملف تكوين البناء والنشر الآلي لمنصة Codemagic (تطبيق ثري لإدارة الثروات والمالية الشخصية)
# ==============================================================================

workflows:
  # ----------------------------------------------------------------------------
  # 1. مسار بناء حزم أندرويد (Google Play AAB & APK)
  # ----------------------------------------------------------------------------
  android-workflow:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.x
      java: 17
      groups:
        - android_signing
        - google_play_credentials
      vars:
        PACKAGE_NAME: "com.thari.finance.app"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'release/*'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Print environment details
        script: |
          node --version
          npm --version
          java -version

      - name: Install dependencies
        script: |
          npm ci --prefer-offline || npm install

      - name: Code quality check and linting
        script: |
          npm run lint

      - name: Build Web production assets
        script: |
          npm run build

      - name: Capacitor Android synchronization
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android release keystore
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.jks
            cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file('/tmp/keystore.jks')
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          else
            echo "Building without explicit keystore injection"
          fi

      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease --stacktrace
    artifacts:
      - "android/app/build/outputs/bundle/release/*.aab"
      - "android/app/build/outputs/apk/release/*.apk"
      - "dist/**"
    publishing:
      email:
        recipients:
          - Dia840990@gmail.com
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------------------------
  # 2. مسار بناء حزم آبل iOS (TestFlight / App Store IPA)
  # ----------------------------------------------------------------------------
  ios-workflow:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.x
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
        - ios_signing
      vars:
        BUNDLE_ID: "com.thari.finance.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'release/*'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Print environment details
        script: |
          node --version
          npm --version
          xcodebuild -version
          pod --version

      - name: Install dependencies
        script: |
          npm ci --prefer-offline || npm install

      - name: Code quality check and linting
        script: |
          npm run lint

      - name: Build Web production assets
        script: |
          npm run build

      - name: Capacitor iOS synchronization
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Set up code signing profiles
        script: |
          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ]; then
            xcode-project use-profiles
          else
            echo "Skipping signing profile step"
          fi

      - name: Build IPA package
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 10200)) || true
          cd ../..

          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - "build/ios/ipa/*.ipa"
      - "/tmp/xcodebuild_logs/*.log"
      - "*.dSYM.zip"
    publishing:
      email:
        recipients:
          - Dia840990@gmail.com
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------------------------
  # 3. مسار التحقق من حزمة الويب (Web & PWA Verification)
  # ----------------------------------------------------------------------------
  web-verification:
    name: Web PWA Validation
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      node: 20.x
    triggering:
      events:
        - pull_request
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci --prefer-offline || npm install

      - name: TypeScript typecheck & linting
        script: |
          npm run lint

      - name: Production Web Build
        script: |
          npm run build

      - name: Verify Capacitor Config
        script: |
          npx cap sync --dry-run || true
    artifacts:
      - "dist/**"
    publishing:
      email:
        recipients:
          - Dia840990@gmail.com
        notify:
          success: false
          failure: true
