# ==============================================================================
# Codemagic CI/CD Pipeline Configuration
# Project: THARI (ثري) — Financial Management & Ledger Suite
# App ID: com.thari.finance.app
# Stack: React 18 + Vite 6 + TypeScript + Capacitor 6 (iOS & Android)
# ==============================================================================

workflows:
  # ----------------------------------------------------------------------------
  # 1. Android Release & Debug Workflow (AAB / APK)
  # ----------------------------------------------------------------------------
  android-workflow:
    name: Android Release Build (Google Play AAB & Universal APK)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.x
      java: 17
      groups:
        # Group created in Codemagic UI: containing CM_KEYSTORE, CM_KEYSTORE_PASSWORD,
        # CM_KEY_ALIAS, CM_KEY_PASSWORD, and GCLOUD_SERVICE_KEY (for Google Play publishing)
        - android_signing
        - google_play_credentials
      vars:
        PACKAGE_NAME: "com.thari.finance.app"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'release/*'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up environment and print versions
        script: |
          node --version
          npm --version
          java -version

      - name: Install dependencies
        script: |
          npm ci --prefer-offline || npm install

      - name: Type check and code linting
        script: |
          npm run lint

      - name: Build Web production distribution (Vite)
        script: |
          npm run build

      - name: Capacitor Android setup & sync
        script: |
          # Add Android platform if not present, then sync assets & plugins
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Set up Android keystore (Release Signing)
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.jks
            cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file('/tmp/keystore.jks')
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          else
            echo "Warning: CM_KEYSTORE variable not set, building unsigned release artifact."
          fi

      - name: Build Android AAB (App Bundle for Google Play)
        script: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Build Android APK (Universal / Testing)
        script: |
          cd android
          ./gradlew assembleRelease --stacktrace
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - dist/**
    publishing:
      email:
        recipients:
          - Dia840990@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment to enable automatic Google Play publishing
      # google_play:
      #   credentials: $GCLOUD_SERVICE_KEY
      #   track: internal # internal | alpha | beta | production
      #   in_app_update_priority: 0

  # ----------------------------------------------------------------------------
  # 2. iOS Release Workflow (TestFlight / App Store IPA)
  # ----------------------------------------------------------------------------
  ios-workflow:
    name: iOS Release Build (App Store / TestFlight IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.x
      xcode: latest
      cocoapods: default
      groups:
        # Group created in Codemagic UI for Apple Developer Portal credentials
        # (APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY)
        - app_store_credentials
        - ios_signing
      vars:
        BUNDLE_ID: "com.thari.finance.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'release/*'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up environment and print versions
        script: |
          node --version
          npm --version
          xcodebuild -version
          pod --version

      - name: Install dependencies
        script: |
          npm ci --prefer-offline || npm install

      - name: Type check and code linting
        script: |
          npm run lint

      - name: Build Web production distribution (Vite)
        script: |
          npm run build

      - name: Capacitor iOS setup & sync
        script: |
          # Add iOS platform if not present, then sync assets & CocoaPods
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Set up code signing settings on Xcode project
        script: |
          if [ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ]; then
            xcode-project use-profiles
          else
            echo "Skipping automated signing profile download (credentials not configured)."
          fi

      - name: Build IPA for App Store distribution
        script: |
          # Set build number based on Codemagic build run
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 10200)) || true
          cd ../..

          # Build .ipa package
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - *.dSYM.zip
    publishing:
      email:
        recipients:
          - Dia840990@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment to enable automatic TestFlight / App Store Connect publishing
      # app_store_connect:
      #   auth: integration # or api_key
      #   submit_to_testflight: true
      #   expire_build_submitted_for_testflight: true

  # ----------------------------------------------------------------------------
  # 3. Web & PWA Verification Workflow
  # ----------------------------------------------------------------------------
  web-verification:
    name: Web PWA Validation & Asset Bundle
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      node: 20.x
    triggering:
      events:
        - pull_request
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci --prefer-offline || npm install

      - name: Static Analysis & TypeScript Typecheck
        script: |
          npm run lint

      - name: Production Web Build
        script: |
          npm run build

      - name: Capacitor Configuration Verification
        script: |
          npx cap sync --dry-run || true
    artifacts:
      - dist/**
    publishing:
      email:
        recipients:
          - Dia840990@gmail.com
        notify:
          success: false
          failure: true
